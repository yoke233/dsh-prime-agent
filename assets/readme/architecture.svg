<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">唯一模型可见的 repl 路由</title>
  <desc id="desc">repl {code} 经 Agent scope 用可信 exec.agent.id 解析 Realm identity,host primeRealmRuntime 服务准入持久 Realm Worker;官方 code-runtime row 未改动,非 Prime 会话继续官方 one-shot。</desc>

  <rect width="1200" height="420" rx="24" fill="#F7F5EF"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="23.25" fill="none" stroke="#E2DCCB" stroke-width="1.5"/>

  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- lane captions -->
    <text x="48" y="62" font-size="18" fill="#4A5262">Prime 会话</text>
    <text x="48" y="226" font-size="18" fill="#4A5262">非 Prime 会话</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- repl -->
    <rect x="48" y="84" width="180" height="100" rx="12" fill="#FFFFFF" stroke="#2F6FD6" stroke-width="1.5"/>
    <text x="138" y="120" font-size="22" fill="#20262E" text-anchor="middle">repl</text>
    <text x="138" y="146" font-size="18" fill="#8A8FA0" text-anchor="middle">{ code }</text>
    <text x="138" y="172" font-size="17" fill="#8A8FA0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">唯一模型可见工具</text>

    <path d="M 228 134 L 276 134" stroke="#C97B22" stroke-width="2" fill="none"/>
    <path d="M 270 130 L 278 134 L 270 138" fill="none" stroke="#C97B22" stroke-width="2"/>

    <!-- agent scope -->
    <rect x="276" y="84" width="240" height="100" rx="12" fill="#FFFFFF" stroke="#DDD7C6" stroke-width="1.5"/>
    <text x="396" y="114" font-size="20" fill="#20262E" text-anchor="middle">dsh-prime-agent</text>
    <text x="396" y="138" font-size="17" fill="#4A5262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Agent scope</text>
    <text x="396" y="164" font-size="15" fill="#8A8FA0" text-anchor="middle">exec.agent.id → Realm identity</text>

    <path d="M 516 134 L 564 134" stroke="#C97B22" stroke-width="2" fill="none"/>
    <path d="M 558 130 L 566 134 L 558 138" fill="none" stroke="#C97B22" stroke-width="2"/>

    <!-- host service -->
    <rect x="564" y="84" width="250" height="100" rx="12" fill="#EEF3FB" stroke="#2F6FD6" stroke-width="1.5"/>
    <text x="689" y="114" font-size="20" fill="#20262E" text-anchor="middle">primeRealmRuntime</text>
    <text x="689" y="138" font-size="17" fill="#4A5262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">host 服务 · 按 Realm id 准入 pool</text>
    <text x="689" y="164" font-size="15" fill="#8A8FA0" text-anchor="middle">跨进程 lease · 预算 · 取消</text>

    <path d="M 814 134 L 862 134" stroke="#C97B22" stroke-width="2" fill="none"/>
    <path d="M 856 130 L 864 134 L 856 138" fill="none" stroke="#C97B22" stroke-width="2"/>

    <!-- persistent realm -->
    <rect x="862" y="84" width="290" height="100" rx="12" fill="#FDF6EC" stroke="#C97B22" stroke-width="1.5"/>
    <text x="1007" y="118" font-size="20" fill="#20262E" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">持久 Realm Worker</text>
    <text x="1007" y="146" font-size="17" fill="#4A5262" text-anchor="middle">live namespace &#183; cells</text>
    <text x="1007" y="172" font-size="15" fill="#8A8FA0" text-anchor="middle">single latest completion（$_）</text>

    <!-- official lane -->
    <rect x="564" y="246" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDD7C6" stroke-width="1.5"/>
    <text x="689" y="278" font-size="19" fill="#20262E" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">官方 code-runtime row</text>
    <text x="689" y="304" font-size="17" fill="#4A5262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">未改动 · 与 Prime 并存</text>
    <text x="689" y="330" font-size="16" fill="#8A8FA0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">one-shot 语义</text>

    <path d="M 814 296 L 862 296" stroke="#C6BFAD" stroke-width="2" fill="none"/>
    <path d="M 856 292 L 864 296 L 856 300" fill="none" stroke="#C6BFAD" stroke-width="2"/>

    <rect x="862" y="246" width="290" height="100" rx="12" fill="#FFFFFF" stroke="#DDD7C6" stroke-width="1.5"/>
    <text x="1007" y="282" font-size="19" fill="#20262E" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">官方 one-shot Worker</text>
    <text x="1007" y="308" font-size="17" fill="#4A5262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">默认语义不变</text>
    <text x="1007" y="330" font-size="16" fill="#8A8FA0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">非 Prime 会话</text>

    <text x="48" y="388" font-size="17" fill="#8A8FA0">可信 exec.agent.id 路由 &#183; 模型 schema 只有 repl &#183; 无握手 / 无 fallback &#183; tools / agents / jobs 为 cell 内隐藏绑定</text>
  </g>
</svg>
