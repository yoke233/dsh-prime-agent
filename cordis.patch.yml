# Applied automatically once `dsh plugin add` lists this package in the
# profile's bundles. The single operation is a pure insert: the official
# `code-runtime` row is left untouched, so non-Prime hosts keep the shipped
# one-shot runtime verbatim. The inserted row mounts the Prime host plugin,
# which registers the uniquely named `primeRealmRuntime` service, watches its
# owning parent, and places the packaged preset.
#
# Adjacent-agent message delivery stays with the DSH 0.1.2-rc.1 base bundle. The
# child-scoped `tool-subagent-report` row was retired upstream; its official
# `tool-subagent-control` now advertises one `send_message({ agent_id, message })`
# for both directions. Every accepted message uses `Agent.steer()`: a running
# target consumes it at the nearest step boundary and an idle target starts a
# turn, with continuation-manager waking accounting and next-step FIFO ordering.
# This package neither disables nor duplicates that host-owned capability.
#
# The default preset, `tools` mode, and every existing agent preset stay
# untouched; the packaged Prime preset is placed into `$DSH_HOME/.agent-presets`
# by the runtime row at startup (copy-if-absent), not by this patch.
#
# `stateDirectory` MUST stay textually identical to the expression in
# `agent-presets/prime/agent.cordis.yml` — both sides read the same
# `realm-identity/hmac.key`, and `tests/packaging-boundary.spec.ts` locks the
# two files together.
- insert:
    - id: prime-code-runtime
      name: dsh-prime-agent/runtime
      config:
        stateDirectory: !!js dshHomePath('prime-agent')
