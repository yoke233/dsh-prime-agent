# Applied automatically once `dsh plugin add` lists this package in the
# profile's bundles. The two operations form one runtime replacement.
#
# Retire the official one-shot `code-runtime` row when the Profile has one,
# then insert the Prime runtime. The `name` field on the disable is an assertion
# protecting a swapped-provider row from being disabled. A TUI Profile has no
# public `code-runtime` row, so that patch is skipped and the independent insert
# still lands. This package carries the official runtime dependencies and the
# Prime runtime mounts its one-shot fallback privately; no TUI support bundle or
# second public provider is needed. If another provider already owns
# `codeRuntime`, Prime's `apply` fails with a diagnostic naming this patch.
# Non-Prime requests retain official one-shot semantics and budgets.
#
# Subagent report delivery stays with the DSH 0.1.1-rc.2 base bundle. Its official
# `tool-subagent-report` defaults to `next-step`: `parent.steer()` lets a running parent
# consume the report at its nearest step boundary and wakes an idle parent,
# including continuation-manager accounting and report-before-settlement FIFO.
# This package neither disables nor duplicates that host-owned capability.
#
# The default preset, `tools` mode, and every existing agent preset stay
# untouched; the packaged Prime preset is placed into `$DSH_HOME/.agent-presets`
# by the runtime row at startup (copy-if-absent), not by this patch.
#
# `stateDirectory` MUST stay textually identical to the expression in
# `agent-presets/prime/agent.cordis.yml` — both sides read the same
# `realm-identity/hmac.key`, and `tests/packaging-boundary.spec.ts` locks the
# two files together.
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'
  disabled: true

- insert:
    - id: prime-code-runtime
      name: dsh-prime-agent/runtime
      config:
        stateDirectory: !!js dshHomePath('prime-agent')
